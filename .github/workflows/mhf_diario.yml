name: MHF Diario

# 24 sep 2026 · POR QUE HAY 16 INTENTOS
# Las tareas programadas de GitHub son "cuando se pueda", no "a esta hora".
# El 23 sep los tres intentos (06:07, 08:07, 10:07 UTC) llegaron con 4-5 HORAS de retraso
# (11:27, 13:35 y 14:52 UTC) y el 24 sep a las 08:16 UTC no habia llegado ninguno.
# Solucion: empezar antes y llamar a la puerta cada 30 minutos, de 03:17 a 10:47 UTC.
# El primero que entre hace el diario; todos los demas se cortan solos en ~10 segundos
# porque el diario de hoy ya esta hecho (repo publico: los minutos no cuestan nada).
# Minutos 17 y 47: lejos de las horas en punto, que son las mas cargadas.
on:
  schedule:
    - cron: "17,47 3-10 * * 1-5"   # cada 30 min, 03:17-10:47 UTC, lunes a viernes
  workflow_dispatch:

concurrency:
  group: mhf-diario
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Si el diario de HOY ya esta publicado, no se vuelve a gastar ni un credito.
      - name: ¿Ya esta el de hoy?
        id: ya
        run: |
          HOY=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "hecho=no" >> $GITHUB_OUTPUT
            echo "Lanzado a mano: se rehace aunque ya este el de hoy."
          elif [ -f diario/datos.json ] && grep -q "\"generado\": \"$HOY" diario/datos.json; then
            echo "hecho=si" >> $GITHUB_OUTPUT
            echo "El diario de $HOY ya esta publicado. No se repite."
          else
            echo "hecho=no" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.ya.outputs.hecho == 'no'
        with:
          python-version: "3.11"

      - name: Bajar precios y titulares
        if: steps.ya.outputs.hecho == 'no'
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
        run: python diario/recolector.py

      - name: Escribir la lectura
        if: steps.ya.outputs.hecho == 'no'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python diario/redactor.py

      - name: Construir la pagina
        if: steps.ya.outputs.hecho == 'no'
        run: python diario/pagina.py

      - name: Publicar
        if: steps.ya.outputs.hecho == 'no'
        run: |
          git config user.name  "MHF Diario"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add diario/datos.json diario/lectura.json docs/index.html
          git commit -m "diario $(date -u +%Y-%m-%d)" || echo "sin cambios"
          git push
